spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

hdkit:
  telemetry:
    salt: "test-salt"
    userhash-check-enabled: true
    persist-ak-userhash: true
    userhash-whitelist: "test,sha256hash1234"

dashboard:
  npm-package-name: "huaweicloud-devkit"
  npm-publish-date: "2026-08-09"
  npm-api-base: "https://api.npmjs.org"
  aggregation-enabled: false
  npm-fetch-enabled: false
