server:
  port: ${PORT:3001}
spring:
  application:
    name: hdkitservice
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hdkitservice}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

hdkit:
  telemetry:
    salt: "${TELEMETRY_SALT:changeme}"
    userhash-check-enabled: ${TELEMETRY_USERHASH_CHECK_ENABLED:true}
    persist-ak-userhash: ${PERSIST_AK_USERHASH:true}
    userhash-whitelist: ${TELEMETRY_USERHASH_WHITELIST:test,sha256hash1234}
    filter-test-harness-enabled: ${FILTER_TEST_HARNESS_ENABLED:true}
    test-harness-values: ${TEST_HARNESS_VALUES:test}
  rate-limit:
    telemetry:
      global-concurrency: ${RATE_LIMIT_TELEMETRY_CONCURRENCY:200}
      per-ip-per-second: ${RATE_LIMIT_TELEMETRY_PER_IP:100}
      per-install-per-second: ${RATE_LIMIT_TELEMETRY_PER_INSTALL:20}
    userhash:
      global-concurrency: ${RATE_LIMIT_USERHASH_CONCURRENCY:50}
      per-ip-per-second: ${RATE_LIMIT_USERHASH_PER_IP:50}
      per-ak-per-second: ${RATE_LIMIT_USERHASH_PER_AK:10}
  userhash:
    persist-ak-fallback: ${PERSIST_AK_FALLBACK:true}
  auth:
    admin-username: "${ADMIN_USERNAME:admin}"
    admin-password: "${ADMIN_PASSWORD:Hdkit@2026}"
    jwt-secret: "${JWT_SECRET:hdkit-dashboard-jwt-secret-key-2026}"
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}

dashboard:
  npm-package-name: "${DASHBOARD_NPM_PACKAGE_NAME:huaweicloud-devkit}"
  npm-publish-date: "${DASHBOARD_NPM_PUBLISH_DATE:2026-08-09}"
  npm-api-base: "${DASHBOARD_NPM_API_BASE:https://api.npmjs.org}"
  aggregation-enabled: "${DASHBOARD_AGGREGATION_ENABLED:true}"
  npm-fetch-enabled: "${DASHBOARD_NPM_FETCH_ENABLED:true}"
